name: macOS release

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles app
      - name: Empaquetar aplicación
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Latex Workbench.app" "Latex-Workbench-macOS-arm64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: Latex-Workbench-macOS-arm64.zip
